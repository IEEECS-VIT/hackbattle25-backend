<!DOCTYPE html>
<html>

<head>
    <title>Firebase Auth Test</title>
</head>

<body>
    <h1>Get Firebase ID Token</h1>
    <button id="signin-button">Sign in with Google</button>
    <h2>Your ID Token:</h2>
    <pre id="id-token" style="word-wrap: break-word; white-space: pre-wrap">
Sign in to see your token.</pre>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import {
            getAuth,
            GoogleAuthProvider,
            signInWithPopup,
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

      
   const firebaseConfig = {
  apiKey: process.env.NEXT_PUBLIC_FIREBASE_API_KEY,
  authDomain: process.env.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN,
  projectId: process.env.NEXT_PUBLIC_FIREBASE_PROJECT_ID,
  storageBucket: process.env.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET,
  messagingSenderId: process.env.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID,
  appId: process.env.NEXT_PUBLIC_FIREBASE_APP_ID,
};

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        const signinButton = document.getElementById("signin-button");
        const idTokenContainer = document.getElementById("id-token");

        signinButton.onclick = async () => {
            try {
                const result = await signInWithPopup(auth, provider);
                const user = result.user;

                // This is the correct way to get the ID token for your backend
                const idToken = await user.getIdToken();

                console.log("ID Token:", idToken);
                idTokenContainer.textContent = idToken;
            } catch (error) {
                console.error("Authentication Error:", error);
                idTokenContainer.textContent = `Error: ${error.message}`;
            }
        };
    </script>
</body>

</html>
